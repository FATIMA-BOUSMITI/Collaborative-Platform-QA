name: Robot API

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "robot-framework/**"
      - ".github/workflows/robot-api.yml"

jobs:
  api-tests:
    if: vars.QA_API_BASE_URL != ''
    runs-on: ubuntu-latest
    environment: qa
    env:
      QA_API_BASE_URL: ${{ vars.QA_API_BASE_URL }}
      QA_VALID_EMAIL: ${{ secrets.QA_VALID_EMAIL }}
      QA_VALID_PASSWORD: ${{ secrets.QA_VALID_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Robot Framework dependencies
        run: pip install -r robot-framework/requirements.txt
      - name: Run read-only API suite against QA
        run: robot --outputdir reports/robot robot-framework/api
      - name: Upload Robot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-report
          path: reports/robot
          if-no-files-found: warn
