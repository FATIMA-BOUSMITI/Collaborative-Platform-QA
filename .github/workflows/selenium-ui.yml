name: Selenium UI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/test/**"
      - "pom.xml"
      - ".github/workflows/selenium-ui.yml"

jobs:
  ui-tests:
    if: vars.QA_BASE_URL != ''
    runs-on: ubuntu-latest
    environment: qa
    env:
      QA_BASE_URL: ${{ vars.QA_BASE_URL }}
      QA_BROWSER: chrome
      QA_HEADLESS: "true"
      QA_VALID_EMAIL: ${{ secrets.QA_VALID_EMAIL }}
      QA_VALID_PASSWORD: ${{ secrets.QA_VALID_PASSWORD }}
      QA_VALID_LANDING_PATH: ${{ vars.QA_VALID_LANDING_PATH }}
      QA_INVALID_EMAIL: qa.invalid@example.invalid
      QA_INVALID_PASSWORD: not-a-real-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run Selenium tests against the configured QA environment
        run: mvn --batch-mode test
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-evidence
          path: |
            target/surefire-reports
            target/allure-results
          if-no-files-found: warn
